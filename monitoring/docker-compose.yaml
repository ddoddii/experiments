version: '3.8'

# ============================================================
# Monitoring stack: Prometheus + Grafana + Pushgateway
#
# Prometheus scrapes:
#   - vLLM standalone       : host:8000/metrics
#   - vLLM 2P2D (PPD)       : host:8100,8101,8200,8201/metrics
#   - SGLang                : host:8000/metrics  (same job as vllm-standalone)
#   - Pushgateway           : pushgateway:9091
#
# Usage:
#   cd monitoring/
#   docker compose up -d
#   open http://localhost:3000  (admin/admin)
# ============================================================

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/vllm_bfcl_agentic.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - monitoring

  pushgateway:
    image: prom/pushgateway:v1.8.0
    container_name: pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - monitoring

networks:
  monitoring:
    name: monitoring

volumes:
  prometheus_data:
  grafana_data:
