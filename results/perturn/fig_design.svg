<text x="632" y="232" font-family="Times New Roman, Times, serif" font-size="10.5" fill="#009E73" font-weight="bold" text-anchor="middle" >park evicted KV → idlest P</text>
<text x="632" y="219" font-family="Times New Roman, Times, serif" font-size="9.5" fill="#555555" font-weight="normal" text-anchor="middle" >(CUDA IPC, GPU→GPU)</text>
