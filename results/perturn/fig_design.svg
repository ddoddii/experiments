<text x="185.0" y="141" font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" font-weight="bold" text-anchor="middle" >L2   GPU victim cache</text>
<text x="185.0" y="158" font-family="Times New Roman, Times, serif" font-size="10.5" fill="#555555" font-weight="normal" text-anchor="middle" >transiently-idle HBM</text>
