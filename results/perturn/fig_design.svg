<text x="185.0" y="199" font-family="Times New Roman, Times, serif" font-size="12.5" fill="#111111" font-weight="bold" text-anchor="middle" >L3   host DRAM (HiCache)</text>
<text x="185.0" y="216" font-family="Times New Roman, Times, serif" font-size="10.5" fill="#555555" font-weight="normal" text-anchor="middle" >CPU / RAM contended</text>
<rect x="78" y="236" width="214" height="50" rx="7" fill="#F0F0F0" stroke="#555555" stroke-width="1.2" />
<text x="185.0" y="266" font-family="Times New Roman, Times, serif" font-size="12.5" fill="#555555" font-weight="bold" text-anchor="middle" >L4   disk (file backend)</text>
<polygon points="304.0,129.5 305.9,134.5 311.1,134.7 307.0,138.0 308.4,143.1 304.0,140.2 299.6,143.1 301.0,138.0 296.9,134.7 302.1,134.5" fill="#009E73"/>
<text x="316" y="133" font-family="Times New Roman, Times, serif" font-size="10.5" fill="#009E73" font-weight="bold" text-anchor="start" >this</text>
