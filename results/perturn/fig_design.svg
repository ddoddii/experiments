<text x="185" y="320" font-family="Times New Roman, Times, serif" font-size="11" fill="#111111" font-weight="bold" text-anchor="middle" >victim = evicted KV kept on idle GPU</text>
<text x="185" y="336" font-family="Times New Roman, Times, serif" font-size="11" fill="#555555" font-weight="normal" text-anchor="middle" >instead of spilled to CPU/host</text>
<line x1="352" y1="46" x2="352" y2="470" stroke="#CFCFCF" stroke-width="1"/>
<text x="690" y="30" font-family="Times New Roman, Times, serif" font-size="15" fill="#111111" font-weight="bold" text-anchor="middle" >(b) Detect → Park → Fetch   (2P2D)</text>
